{{- $css := resources.Get "css/workshop-shortcodes.css" -}}
{{- if $css -}}
  {{- if hugo.IsProduction -}}
    {{- $css = $css | resources.Minify | resources.Fingerprint -}}
  {{- end -}}
<link rel="stylesheet" href="{{ $css.RelPermalink }}"{{ with $css.Data.Integrity }} integrity="{{ . }}"{{ end }}>
{{- end -}}
